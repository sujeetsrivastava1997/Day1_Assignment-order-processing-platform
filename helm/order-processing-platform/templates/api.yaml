apiVersion: apps/v1
kind: Deployment
metadata: {name: order-api}
spec:
  replicas: {{ .Values.services.orderApi.replicas }}
  selector: {matchLabels: {app: order-api}}
  template:
    metadata: {labels: {app: order-api}}
    spec:
      containers:
      - name: order-api
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.services.orderApi.image }}:{{ .Values.imageTag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports: [{containerPort: 3000}]
        envFrom: [{secretRef: {name: order-processing-secrets}}]
        env: [{name: ORDERS_QUEUE, value: orders}]
        readinessProbe: {httpGet: {path: /health, port: 3000}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health, port: 3000}, initialDelaySeconds: 10, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: order-api}
spec:
  selector: {app: order-api}
  ports: [{port: 80, targetPort: 3000}]
  type: LoadBalancer
